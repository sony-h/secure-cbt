services:
  # ── PostgreSQL ─────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: secure-cbt-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: secure_cbt
      TZ: Asia/Jakarta
    ports:
      - '5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Redis ──────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: secure-cbt-redis
    command: redis-server --appendonly yes
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5

  # ── MinIO (S3-compatible storage) ──────────────────────────
  minio:
    image: minio/minio:RELEASE.2024-07-01T00-00-00Z
    container_name: secure-cbt-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - '9000:9000'  # API
      - '9001:9001'  # Console
    volumes:
      - minio_data:/data
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Prisma Migration Runner (one-shot) ─────────────────────
  prisma-migrate:
    build:
      context: .
      dockerfile: docker/Dockerfile.prisma
    container_name: secure-cbt-prisma-migrate
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: 'postgresql://postgres:postgres@postgres:5432/secure_cbt?schema=public'
    volumes:
      - ./apps/backend/prisma:/app/apps/backend/prisma
    command: ['sh', '-c', 'npx prisma generate && npx prisma migrate deploy']
    profiles:
      - setup

  # ── Prisma Seed Runner (one-shot) ──────────────────────────
  prisma-seed:
    build:
      context: .
      dockerfile: docker/Dockerfile.prisma
    container_name: secure-cbt-prisma-seed
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: 'postgresql://postgres:postgres@postgres:5432/secure_cbt?schema=public'
    volumes:
      - ./apps/backend/prisma:/app/apps/backend/prisma
    command: ['sh', '-c', 'npx prisma generate && npx prisma db seed']
    profiles:
      - setup

  # ── Backend API (NestJS) ─────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
      target: development
    container_name: secure-cbt-backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: 'postgresql://postgres:postgres@postgres:5432/secure_cbt?schema=public'
      REDIS_HOST: redis
      REDIS_PORT: '6379'
      BULLMQ_REDIS_HOST: redis
      BULLMQ_REDIS_PORT: '6379'
      JWT_ACCESS_SECRET: 'dev-access-secret'
      JWT_REFRESH_SECRET: 'dev-refresh-secret'
      PORT: '3000'
      NODE_ENV: 'development'
      CORS_ORIGIN: 'http://localhost:3001'
      TZ: Asia/Jakarta
    ports:
      - '3000:3000'
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
    volumes:
      - ./apps/backend/prisma:/app/apps/backend/prisma
      - ./apps/backend/src:/app/apps/backend/src
      - ./packages/shared/src:/app/packages/shared/src

volumes:
  postgres_data:
  redis_data:
  minio_data:
