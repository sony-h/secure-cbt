# ── Secure CBT Production Infrastructure ───────────────────────────
# Run with: docker compose -f docker-compose.prod.yml up -d
# Note: Ports are bound to 127.0.0.1 for maximum host isolation.

services:
  # ── PostgreSQL ─────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: secure-cbt-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
      POSTGRES_DB: ${DB_NAME:-secure_cbt}
      TZ: Asia/Jakarta
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '2.0'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER:-postgres}']
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Redis ──────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: secure-cbt-redis
    restart: unless-stopped
    command: >
      sh -c '
        if [ -n "$$REDIS_PASSWORD" ]; then
          redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD";
        else
          redis-server --appendonly yes;
        fi
      '
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - redis_prod_data:/data
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
    healthcheck:
      test: >
        sh -c '
          if [ -n "$$REDIS_PASSWORD" ]; then
            redis-cli -a "$$REDIS_PASSWORD" ping;
          else
            redis-cli ping;
          fi
        '
      interval: 5s
      timeout: 3s
      retries: 5

  # ── MinIO (S3-compatible storage) — DISABLED 2026-10-03 ──────
  # MinIO deleted its community Docker images (Docker Hub + quay.io +
  # ghcr.io + dl.min.io binaries all unavailable as of Sep 2026), and
  # the app has no MinIO code paths yet (asset uploads = Phase 14,
  # not implemented). No concrete requirement → disabled until an
  # S3-compatible backend is chosen. Re-enable with a working image
  # when Phase 14 lands.
  #
  # minio:
  #   image: minio/minio:latest
  #   container_name: secure-cbt-minio
  #   restart: unless-stopped
  #   command: server /data --console-address ":9001"
  #   environment:
  #     MINIO_ROOT_USER: ${MINIO_ROOT_USER:-cbt_minio_admin}
  #     MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD must be set in .env}
  #   ports:
  #     - '127.0.0.1:9000:9000'
  #     - '127.0.0.1:9001:9001'
  #   volumes:
  #     - minio_prod_data:/data
  #   deploy:
  #     resources:
  #       limits:
  #         memory: 1G
  #         cpus: '1.0'
  #   healthcheck:
  #     test: ['CMD', 'mc', 'ready', 'local']
  #     interval: 5s
  #     timeout: 5s
  #     retries: 5

volumes:
  postgres_prod_data:
  redis_prod_data:
  # minio_prod_data:   # disabled with the minio service (see above)
