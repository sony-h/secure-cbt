name: secure_cbt_mobile
description: Secure CBT - Student Mobile App for Indonesian Schools
publish_to: 'none'
version: 1.1.1+7

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.22.0'

dependencies:
  flutter:
    sdk: flutter

  # ── State Management ────────────────────────────────────────
  flutter_riverpod: ^2.5.0
  riverpod_annotation: ^2.3.0

  # ── Local Database (Offline-first) ──────────────────────────
  drift: ^2.18.0
  drift_flutter: ^0.1.0
  sqlite3_flutter_libs: ^0.5.0
  path_provider: ^2.1.0
  path: ^1.9.0

  # ── Networking ──────────────────────────────────────────────
  dio: ^5.5.0
  dio_smart_retry: ^6.0.0

  # ── Code Generation ─────────────────────────────────────────
  freezed_annotation: ^2.4.0
  json_annotation: ^4.9.0

  # ── Routing ─────────────────────────────────────────────────
  go_router: ^14.2.0

  # ── UI ──────────────────────────────────────────────────────
  google_fonts: ^6.2.0
  flutter_math_fork: ^0.7.2
  cached_network_image: ^3.3.1

  # ── Utilities ───────────────────────────────────────────────
  flutter_secure_storage: ^9.2.0
  intl: ^0.19.0
  uuid: ^4.4.0
  logger: ^2.3.0

  # ── Socket.io ───────────────────────────────────────────────
  socket_io_client: ^2.0.0

  # ── Platform / Security ─────────────────────────────────────
  wakelock_plus: ^1.1.0
  app_links: ^6.1.0
  device_info_plus: ^11.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # ── Code Generation ─────────────────────────────────────────
  build_runner: ^2.4.0
  freezed: ^2.5.0
  json_serializable: ^6.8.0
  riverpod_generator: ^2.4.0

  # ── Drift ───────────────────────────────────────────────────
  drift_dev: ^2.18.0

  # ── Linting ─────────────────────────────────────────────────
  flutter_lints: ^4.0.0

  # ── Testing ─────────────────────────────────────────────────
  mocktail: ^1.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
