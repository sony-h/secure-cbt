# ── Nginx Reverse Proxy Configuration for Secure CBT ───────────
# Place this file in /etc/nginx/sites-available/secure-cbt
# Enable with: sudo ln -s /etc/nginx/sites-available/secure-cbt /etc/nginx/sites-enabled/
# SSL will be configured automatically by certbot:
#   sudo certbot --nginx -d cbt.domainanda.com -d api.domainanda.com

# ── 1. Backend REST API & Socket.io WebSockets ──────────────────
server {
    listen 80;
    server_name api.domainanda.com;

    client_max_body_size 50M;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # WebSocket support (Socket.io monitoring gateway)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Long timeouts to prevent monitoring disconnections during exams
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_connect_timeout 60s;
    }
}

# ── 2. Next.js Admin & Teacher Dashboard ────────────────────────
server {
    listen 80;
    server_name cbt.domainanda.com;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Next.js static asset caching headers can pass through
        proxy_cache_bypass $http_upgrade;
    }
}

